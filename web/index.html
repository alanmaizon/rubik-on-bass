<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>br0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Rubik:wght@700&display=swap" rel="stylesheet">

    <style>
        body { 
            margin: 0; 
            overflow: hidden;
            font-family: 'Rubik', sans-serif;
            background-color: #1a1a1a;
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none;     /* IE 10+ and Edge */
            user-select: none;         /* Standard syntax */
        }
        #container { width: 100vw; height: 100vh; }
        #title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'UnifrakturCook', 'Old English Text MT', serif;
            font-size: clamp(4.5rem, 12vw, 9rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            padding-left: 0.12em;
            line-height: 0.9;
            color: #bfc3c7;
            background: linear-gradient(180deg, #f2f3f4 0%, #aeb3b8 45%, #d9dcdf 60%, #858b92 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: #bfc3c7;
            -webkit-text-stroke: 2px #343a40;
            text-shadow:
                0 2px 0 #697078,
                0 7px 12px rgba(0,0,0,0.8),
                0 0 18px rgba(210,215,220,0.3);
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.55));
            z-index: 10;
            pointer-events: none;
        }

        /* --- Side Menu Styles --- */
        #side-menu {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
        }
        #menu-toggle-btn {
            width: 36px;
            height: 90px;
            background: linear-gradient(180deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 8px 0 0 8px;
            cursor: pointer;
            font-size: 14px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
            transition: background 0.2s, width 0.2s;
        }
        #menu-toggle-btn:hover { width: 42px; background: linear-gradient(180deg, #3395ff, #007bff); }
        .menu-content {
            background-color: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0;
            border-radius: 8px 0 0 8px;
            border: 1px solid rgba(255,255,255,0.1);
            border-right: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: max-width 0.4s ease-in-out, padding 0.4s ease-in-out;
            max-width: 0;
            overflow: hidden;
            white-space: nowrap;
        }
        #side-menu.is-open .menu-content {
            max-width: 800px;
            padding: 20px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            text-align: center;
        }
        .grid-title {
            grid-column: 1 / -1;
            color: rgba(255,255,255,0.7);
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .section-divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 0;
        }
        button, select, input {
            font-family: 'Rubik', sans-serif;
            padding: 8px 12px;
            font-size: 14px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }
        button:hover { background-color: rgba(255,255,255,0.2); }
        button:active { transform: scale(0.95); background-color: rgba(255,255,255,0.25); }
        button:disabled { background-color: rgba(255,255,255,0.05); color: rgba(255,255,255,0.3); cursor: not-allowed; }
        button.primary-action {
            background: linear-gradient(135deg, #007bff, #0056b3);
            border-color: #007bff;
        }
        button.primary-action:hover { background: linear-gradient(135deg, #3395ff, #007bff); }
        button.primary-action:disabled { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }
        input[type="number"] { width: 70px; text-align: center; box-sizing: border-box; }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            border: none;
            outline: none;
            padding: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
            border: 2px solid #fff;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
            border: 2px solid #fff;
        }
        /* Toggle switch styling */
        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.15);
            border-radius: 22px;
            transition: background-color 0.2s;
        }
        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider {
            background-color: #007bff;
        }
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(18px);
        }
        label { color: rgba(255,255,255,0.8); font-size: 13px; }

        /* --- Keyboard Shortcut Hint --- */
        #hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            z-index: 10;
            pointer-events: none;
        }
        #step-sequencer {
            position: absolute;
            left: 50%;
            bottom: 42px;
            transform: translateX(-50%);
            z-index: 10;
            width: min(92vw, 720px);
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            background: rgba(10, 10, 10, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #step-sequencer-title {
            color: rgba(255,255,255,0.7);
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
        }
        #step-grid {
            display: grid;
            grid-template-columns: repeat(16, minmax(18px, 1fr));
            gap: 4px;
        }
        .step {
            min-width: 0;
            padding: 7px 2px;
            font-size: 11px;
            border-radius: 4px;
            color: white;
            background: rgba(255,255,255,0.12);
            border-color: transparent;
        }
        .step.is-muted { opacity: 0.35; text-decoration: line-through; }
        .step.is-active {
            color: #111;
            background: #ffd500;
            border-color: white;
            box-shadow: 0 0 12px rgba(255,213,0,0.8);
        }
        @media (max-width: 600px) {
            #step-sequencer { bottom: 38px; padding: 8px; }
            #step-grid { gap: 2px; }
            .step { padding: 6px 0; font-size: 9px; }
        }
        #drum-machine {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            z-index: 10;
            width: min(34vw, 390px);
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            background: rgba(10, 10, 10, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #drum-machine-title {
            color: rgba(255,255,255,0.7);
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
        }
        .drum-track {
            display: grid;
            grid-template-columns: 42px repeat(16, minmax(10px, 1fr));
            gap: 3px;
            align-items: center;
            margin-top: 4px;
        }
        .drum-track-label {
            color: rgba(255,255,255,0.8);
            font-size: 10px;
            text-transform: uppercase;
        }
        .drum-step {
            min-width: 0;
            height: 18px;
            padding: 0;
            border-radius: 3px;
            background: rgba(255,255,255,0.1);
            border-color: transparent;
        }
        .drum-step.is-on { background: #007bff; }
        .drum-step.is-active { box-shadow: 0 0 8px #ffd500; border-color: #ffd500; }
        @media (max-width: 800px) {
            #drum-machine { left: 8px; top: auto; bottom: 150px; transform: none; width: min(82vw, 390px); }
        }
        @media (max-width: 600px) {
            #drum-machine { bottom: 145px; padding: 8px; }
            .drum-track { grid-template-columns: 34px repeat(16, minmax(8px, 1fr)); gap: 2px; }
            .drum-step { height: 14px; }
        }
    </style>
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="title">br0</div>
    <div id="container"></div>

    <div id="side-menu">
        <button id="menu-toggle-btn">☰ MENU</button>
        <div class="menu-content">
            <div class="button-grid">
                <div class="grid-title">4x4 Controls</div>
                <button id="btn_U">U</button><button id="btn_u_inner">u</button><button id="btn_u_inner_prime">u'</button><button id="btn_U_prime">U'</button>
                <button id="btn_L">L</button><button id="btn_l_inner">l</button><button id="btn_l_inner_prime">l'</button><button id="btn_L_prime">L'</button>
                <button id="btn_R">R</button><button id="btn_r_inner">r</button><button id="btn_r_inner_prime">r'</button><button id="btn_R_prime">R'</button>
                <button id="btn_D">D</button><button id="btn_d_inner">d</button><button id="btn_d_inner_prime">d'</button><button id="btn_D_prime">D'</button>
            </div>

            <hr class="section-divider">

            <div class="button-grid">
                <div class="grid-title">Sequencer</div>
                <label for="bpmInput" class="grid-title" style="margin-top: 4px;">BPM</label>
                <div style="grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <input type="number" id="bpmInput" min="20" max="200" value="120" style="width: 70px; text-align: center; padding: 5px;">
                    <input type="range" id="bpmSlider" min="20" max="200" value="120" style="width: 100%;">
                </div>
                <div style="grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0;">
                    <label class="toggle-switch">
                        <input type="checkbox" id="halfLengthSwitch">
                        <span class="toggle-slider"></span>
                    </label>
                    <label for="halfLengthSwitch">Half Note Length</label>
                </div>
                <button id="toggleLoopBtn" class="primary-action" style="grid-column: 1 / -1;" disabled>Loading...</button>
            </div>

            <hr class="section-divider">

            <div class="button-grid">
                <div class="grid-title">Master</div>
                <button id="muteAllBtn" style="grid-column: 1 / 3;">Mute All</button>
                <button id="unmuteAllBtn" style="grid-column: 3 / 5;">Unmute All</button>
                <button id="resetCubeBtn" style="grid-column: 1 / -1; margin-top: 5px;">Reset Cube</button>
                <button id="playRandomBtn" style="grid-column: 1 / -1; margin-top: 5px;">Scramble</button>
            </div>
        </div>
    </div>

    <section id="step-sequencer" aria-label="16-step sequencer">
        <div id="step-sequencer-title">16-step loop · click a step to mute</div>
        <div id="step-grid"></div>
    </section>

    <section id="drum-machine" aria-label="808 drum machine">
        <div id="drum-machine-title">808 drum machine · click steps</div>
        <div class="drum-track" data-track="kick"><span class="drum-track-label">Kick</span></div>
        <div class="drum-track" data-track="snare"><span class="drum-track-label">Snare</span></div>
        <div class="drum-track" data-track="hat"><span class="drum-track-label">Hat</span></div>
        <div class="drum-track" data-track="clap"><span class="drum-track-label">Clap</span></div>
    </section>

    <div id="hint">Drag to orbit · Click stickers to mute</div>

    <script type="module" src="script.js"></script>
</body>
</html>
